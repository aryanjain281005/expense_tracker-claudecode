{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add expense</h1>
            <p class="auth-subtitle">Record what you spent</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input amount-input" placeholder="0.00"
                           step="0.01" min="0.01"
                           value="{{ form.amount or '' }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled{% if not form.category %} selected{% endif %}>Select a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}"{% if form.category == cat %} selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input"
                           value="{{ form.date or '' }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description <span class="form-optional">(optional)</span></label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Groceries"
                           maxlength="{{ max_description_length }}" value="{{ form.description or '' }}">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-submit">Save expense</button>
                    <a class="btn-ghost" href="{{ url_for('profile') }}">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
